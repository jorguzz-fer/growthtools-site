server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  v1.html index.html;

    # This container serves a single page. Any request path resolves to
    # v1.html, so the site works both at the domain root AND under a path
    # prefix like /coratti — regardless of whether the reverse proxy
    # (Coolify/Traefik) strips the prefix before forwarding. No redirects,
    # so there is no risk of a redirect loop when the prefix is stripped.
    location / {
        try_files $uri $uri/ /v1.html;
    }

    # No cache for the HTML entrypoint so updates go live immediately.
    location = /v1.html {
        add_header Cache-Control "no-cache";
    }

    gzip              on;
    gzip_types        text/plain text/css application/javascript text/html image/svg+xml;
    gzip_min_length   1024;

    # Basic security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}

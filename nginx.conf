server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  v1.html index.html;

    # Serve v1.html at the root, fall back to it for unknown paths.
    location / {
        try_files $uri $uri/ /v1.html;
    }

    # Long cache for static assets, no cache for the HTML entrypoint.
    location = /v1.html {
        add_header Cache-Control "no-cache";
    }

    gzip              on;
    gzip_types        text/plain text/css application/javascript text/html image/svg+xml;
    gzip_min_length   1024;

    # Basic security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
